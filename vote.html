<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>who's the killer?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0b0d13;
        --smoke: #12161f;
        --fog: #2b3140;
        --chalk: #d6dbe4;
        --dust: #78818f;
        --blood: #b3202e;
        --lamp: #dfb35e;
        --type: "Special Elite", "Courier New", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--ink);
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--chalk);
        font-family: system-ui, sans-serif;
        display: flex;
        justify-content: center;
        /* a desk lamp somewhere off in the dark */
        background:
          radial-gradient(
            120% 90% at 50% 0%,
            rgba(224, 180, 94, 0.06),
            transparent 55%
          ),
          radial-gradient(
            140% 120% at 50% 60%,
            transparent 40%,
            rgba(0, 0, 0, 0.7) 100%
          ),
          var(--ink);
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 26px 18px 48px;
      }

      /* ---- case file header ---- */
      .eyebrow {
        font-family: var(--type);
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--dust);
        text-transform: uppercase;
        text-align: center;
        margin: 0 0 10px;
      }
      h1 {
        font-family: var(--type);
        font-weight: 400;
        font-size: 30px;
        line-height: 1.1;
        letter-spacing: 1px;
        text-align: center;
        text-transform: uppercase;
        margin: 0 0 10px;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8);
      }
      h1 em {
        font-style: normal;
        color: var(--blood);
      }
      .sub {
        text-align: center;
        color: var(--dust);
        font-size: 13px;
        line-height: 1.5;
        margin: 0 auto 24px;
        max-width: 300px;
      }
      .rule {
        border: none;
        border-top: 1px dashed var(--fog);
        margin: 0 0 18px;
      }

      /* ---- suspect dossier rows ---- */
      button.suspect {
        position: relative;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 14px 12px;
        margin-bottom: 10px;
        border: 1px solid var(--fog);
        border-radius: 4px;
        background: var(--smoke);
        color: var(--chalk);
        text-align: left;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      button.suspect:focus-visible {
        outline: 2px solid var(--lamp);
        outline-offset: 2px;
      }
      .mug {
        flex: none;
        width: 52px;
        height: 52px;
        border: 1px solid var(--fog);
        border-radius: 2px;
        background-color: var(--ink);
        background-repeat: no-repeat;
        background-size: 400% 400%; /* 4x4 sheet -> one cell */
        background-position: 0 0; /* front-facing idle pose */
        image-rendering: pixelated;
      }
      .who {
        flex: 1;
        min-width: 0;
      }
      .name {
        display: block;
        font-family: var(--type);
        font-size: 19px;
        letter-spacing: 1px;
      }
      .tail {
        display: block;
        font-size: 12px;
        color: var(--dust);
        font-variant-numeric: tabular-nums;
      }
      /* evidence weight: how much of the room points at them */
      .heat {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        background: var(--blood);
        transition: width 0.6s ease;
      }
      /* the accusation stamp */
      .stamp {
        flex: none;
        font-family: var(--type);
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--blood);
        border: 2px solid var(--blood);
        border-radius: 3px;
        padding: 3px 7px 1px;
        transform: rotate(-8deg);
        opacity: 0.92;
      }
      button.suspect.picked {
        border-color: var(--blood);
        background: color-mix(in srgb, var(--blood) 8%, var(--smoke));
      }
      @media (prefers-reduced-motion: no-preference) {
        button.suspect.picked .stamp {
          animation: slam 0.25s cubic-bezier(0.2, 1.6, 0.4, 1);
        }
        @keyframes slam {
          from {
            transform: rotate(-16deg) scale(1.8);
            opacity: 0;
          }
          to {
            transform: rotate(-8deg) scale(1);
            opacity: 0.92;
          }
        }
      }

      /* ---- sign-in as a detective ---- */
      .panel {
        border: 1px solid var(--fog);
        border-radius: 4px;
        background: var(--smoke);
        padding: 18px 16px;
        margin-bottom: 14px;
      }
      label {
        display: block;
        font-family: var(--type);
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--dust);
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        padding: 10px 2px;
        font-family: var(--type);
        font-size: 20px;
        letter-spacing: 1px;
        color: var(--chalk);
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--dust); /* the signature line */
        border-radius: 0;
      }
      input:focus {
        outline: none;
        border-bottom-color: var(--lamp);
      }
      button.join {
        width: 100%;
        margin-top: 18px;
        padding: 12px;
        font-family: var(--type);
        font-size: 16px;
        letter-spacing: 2px;
        text-transform: uppercase;
        border: 1px solid var(--blood);
        border-radius: 4px;
        background: var(--blood);
        color: #fff;
      }
      button.join:focus-visible {
        outline: 2px solid var(--lamp);
        outline-offset: 2px;
      }

      /* ---- case closed ---- */
      .reveal {
        font-family: var(--type);
        text-align: center;
        font-size: 18px;
        letter-spacing: 1px;
        color: var(--blood);
        margin: 0 0 18px;
      }
      .verdict-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 10px 4px;
        border-bottom: 1px dashed var(--fog);
        font-variant-numeric: tabular-nums;
      }
      .verdict-row .rank {
        flex: none;
        width: 22px;
        font-family: var(--type);
        color: var(--dust);
      }
      .verdict-row .det {
        flex: 1;
        min-width: 0;
        font-family: var(--type);
        font-size: 17px;
        letter-spacing: 1px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .verdict-row .accused {
        font-size: 12px;
        color: var(--dust);
        font-family: system-ui, sans-serif;
      }
      .verdict-row .pts {
        flex: none;
        color: var(--lamp);
        font-size: 17px;
      }
      .verdict-row.first .det,
      .verdict-row.first .pts {
        font-size: 23px;
      }
      .verdict-row.me .det {
        color: var(--lamp);
      }

      .footer {
        text-align: center;
        color: var(--dust);
        font-size: 12px;
        margin-top: 16px;
      }
      .footer b {
        color: var(--chalk);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/vote.ts"></script>
  </body>
</html>
